version: '3.8'

services:
  ai-automation-postgres:
    image: postgres:17-alpine
    container_name: ai-automation-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_automation
    ports:
      - "5432:5432"
    volumes:
      - ai-automation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_automation"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-automation-redis:
    image: redis:7-alpine
    container_name: ai-automation-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ai-automation-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ai-automation-postgres-data:
  ai-automation-redis-data:
